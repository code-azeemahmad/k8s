apiVersion: batch/v1
kind: Job

metadata:
  name: nginx-job
  namespace: nginx

spec:
  completions: 1
  parallelism: 1

  template:
    metadata:
      name: nginx
      labels:
        app: nginx

    spec:
      containers:
        - name: nginx-job
          image: busybox:latest
          command: ["sh", "-c", "echo hello world from azeem && sleep 10"]

      restartPolicy: Never
